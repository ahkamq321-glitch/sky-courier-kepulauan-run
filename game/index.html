<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karst Bay Courier</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f2e; }
  #game, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Karst Bay Courier: fly the bush plane through the rings, drop supplies at the lighthouse and land on the island strips"></canvas>
<canvas id="hud"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
